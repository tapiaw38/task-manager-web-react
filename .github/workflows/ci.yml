name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    quality:
        name: Lint, typecheck, test and build
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22

            - uses: pnpm/action-setup@v5
              with:
                  version: 10

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Check formatting
              run: pnpm format:check

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test:cover

            - name: Build
              run: pnpm build
              env:
                  VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:8081' }}

            - uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist
                  retention-days: 7
